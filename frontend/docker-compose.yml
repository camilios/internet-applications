# هذا الملف للـ Frontend فقط.
# في المشروع الكامل راح يكون عندك docker-compose في الجذر
# يجمع: frontend + api + inventory-service + db...

services:
  frontend:
    build:
      context: .
      args:
        VITE_API_URL: http://localhost:3000/api/v1
    ports:
      - "5173:80"
    restart: unless-stopped
