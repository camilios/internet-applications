name: ecommerce-req5

x-laravel: &laravel
  image: ${REQ5_APP_IMAGE:-ecommerce-req5-app:local}
  restart: unless-stopped
  environment:
    APP_NAME: E-Commerce
    APP_ENV: local
    APP_DEBUG: 'false'
    APP_URL: http://localhost:8015
    APP_KEY: ${APP_KEY:?Set APP_KEY in the project .env}
    JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    TRUSTED_PROXIES: 172.30.55.0/24
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_DATABASE: ecommerce_req5
    DB_USERNAME: laravel
    DB_PASSWORD_FILE: /run/secrets/mysql_password
    DB_REPLICA_ENABLED: 'false'
    SKIP_MIGRATIONS: 'true'
    CACHE_STORE: redis
    SESSION_DRIVER: redis
    REDIS_CLIENT: phpredis
    REDIS_HOST: redis
    LOG_CHANNEL: stderr
    INVENTORY_GRPC_HOST: inventory-service:50051
    CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    BROADCAST_CONNECTION: reverb
    REVERB_APP_ID: ${REVERB_APP_ID:-ecommerce}
    REVERB_APP_KEY: ${REVERB_APP_KEY:-ecommerce-local}
    REVERB_APP_SECRET: ${REVERB_APP_SECRET:?Set REVERB_APP_SECRET in .env}
    REVERB_HOST: reverb
    REVERB_PORT: 8080
    REVERB_SCHEME: http
    REVERB_ALLOWED_ORIGINS: localhost,127.0.0.1
    RABBITMQ_HOST: rabbitmq
    RABBITMQ_USER: ${RABBITMQ_USER:-orders}
    RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    RABBITMQ_VHOST: ${RABBITMQ_VHOST:-ecommerce}
    MAIL_MAILER: array
    ORDER_EMAIL_ALLOW_MOCK: 'true'
    MAIL_FROM_ADDRESS: demo@example.invalid
  secrets: [mysql_password]
  volumes: [public_uploads:/var/www/html/storage/app/public]
  depends_on: &ready
    migrate: {condition: service_completed_successfully}
    redis: {condition: service_healthy}

x-db: &db
  image: mysql:8.0
  restart: unless-stopped
  healthcheck:
    test: [CMD, mysqladmin, ping, -h, '127.0.0.1']
    interval: 4s
    timeout: 4s
    retries: 40

services:
  mysql:
    <<: *db
    environment:
      MYSQL_DATABASE: ecommerce_req5
      MYSQL_USER: laravel
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
    volumes: [primary_data:/var/lib/mysql]
    secrets: [mysql_root_password, mysql_password]
  inventory-mysql:
    <<: *db
    environment:
      MYSQL_DATABASE: inventory_db
      MYSQL_USER: inventory_service
      MYSQL_PASSWORD_FILE: /run/secrets/inventory_mysql_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/inventory_mysql_root_password
    volumes: [inventory_data:/var/lib/mysql]
    secrets: [inventory_mysql_password, inventory_mysql_root_password]
  inventory-service:
    image: ${REQ5_INVENTORY_IMAGE:-ecommerce-req5-inventory:local}
    build: {context: ., dockerfile: inventory-service/Dockerfile}
    restart: unless-stopped
    environment:
      DB_HOST: inventory-mysql
      DB_NAME: inventory_db
      DB_USER: inventory_service
      DB_PASSWORD_FILE: /run/secrets/inventory_mysql_password
      NODE_ENV: production
    secrets: [inventory_mysql_password]
    depends_on:
      inventory-mysql: {condition: service_healthy}
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, 'yes']
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 4s
      timeout: 3s
      retries: 15
  rabbitmq:
    image: ${REQ5_RABBIT_IMAGE:-rabbitmq:4.2-alpine}
    hostname: req5-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-orders}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-ecommerce}
    volumes: [broker_data:/var/lib/rabbitmq]
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, check_running]
      interval: 6s
      timeout: 10s
      retries: 30
  migrate:
    <<: *laravel
    build: ./backend/my-project
    restart: 'no'
    command: [php, artisan, migrate, --force]
    depends_on:
      mysql: {condition: service_healthy}
  api:
    <<: *laravel
    deploy: {replicas: 3}
    networks: [edge, default]
    healthcheck:
      test: [CMD, curl, -fsS, 'http://127.0.0.1:8000/up']
      interval: 5s
      timeout: 4s
      retries: 15
  gateway:
    image: ${REQ5_NGINX_IMAGE:-nginx:1.28-alpine}
    restart: unless-stopped
    ports: ['127.0.0.1:8015:80']
    volumes: ['./ops/req5/nginx.conf:/etc/nginx/conf.d/default.conf:ro']
    networks:
      edge: {}
    depends_on:
      api: {condition: service_healthy}
  email-worker:
    <<: *laravel
    deploy: {replicas: 3}
    command: [php, artisan, 'orders:email-worker']
    stop_grace_period: 45s
    depends_on: &messaging
      <<: *ready
      rabbitmq: {condition: service_healthy}
  outbox-publisher:
    <<: *laravel
    command: [php, artisan, 'outbox:publish']
    depends_on: *messaging
  scheduler:
    <<: *laravel
    command: [php, artisan, 'schedule:work']
  reverb:
    <<: *laravel
    command: [php, artisan, 'reverb:start', '--host=0.0.0.0', '--port=8080']
    ports: ['127.0.0.1:8185:8080']
  broadcast-worker:
    <<: *laravel
    command: [php, artisan, 'queue:work', database, '--queue=broadcasts', '--tries=5', '--backoff=5', '--timeout=30', '--sleep=1']
    depends_on:
      <<: *ready
      reverb: {condition: service_started}

networks:
  default:
    ipam: {config: [{subnet: 172.30.56.0/24}]}
  edge:
    ipam: {config: [{subnet: 172.30.55.0/24}]}
volumes:
  primary_data: {}
  inventory_data: {}
  redis_data: {}
  broker_data: {}

  public_uploads: {}
secrets:
  mysql_password: {file: ./secrets/mysql_password.txt}
  mysql_root_password: {file: ./secrets/mysql_root_password.txt}
  inventory_mysql_password: {file: ./secrets/inventory_mysql_password.txt}
  inventory_mysql_root_password: {file: ./secrets/inventory_mysql_root_password.txt}
