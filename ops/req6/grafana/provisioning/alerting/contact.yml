apiVersion: 1
contactPoints:
  - orgId: 1
    name: Interview notifications
    receivers:
      - uid: req6-webhook
        type: webhook
        settings: {url: 'http://http-metrics:9108/notifications', httpMethod: POST}
        disableResolveMessage: false
policies:
  - orgId: 1
    receiver: Interview notifications
    group_by: [alertname]
    group_wait: 2s
    group_interval: 10s
    repeat_interval: 4h
