{
  "apiVersion": 1,
  "groups": [
    {
      "orgId": 1,
      "name": "Orders health",
      "folder": "Orders",
      "interval": "10s",
      "rules": [
        {
          "uid": "req6-queue",
          "title": "OrderEmailQueueHigh",
          "condition": "B",
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 120,
                "to": 0
              },
              "datasourceUid": "req6-prom",
              "model": {
                "refId": "A",
                "expr": "sum(rabbitmq_queue_messages_ready{queue=\"orders.email\"})",
                "instant": true,
                "range": false,
                "intervalMs": 1000,
                "maxDataPoints": 600,
                "datasource": {
                  "type": "prometheus",
                  "uid": "req6-prom"
                }
              }
            },
            {
              "refId": "B",
              "relativeTimeRange": {
                "from": 0,
                "to": 0
              },
              "datasourceUid": "__expr__",
              "model": {
                "type": "threshold",
                "refId": "B",
                "expression": "A",
                "datasource": {
                  "type": "__expr__",
                  "uid": "__expr__"
                },
                "conditions": [
                  {
                    "type": "query",
                    "query": {
                      "params": [
                        "B"
                      ]
                    },
                    "reducer": {
                      "type": "last",
                      "params": []
                    },
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        4
                      ]
                    },
                    "operator": {
                      "type": "and"
                    }
                  }
                ]
              }
            }
          ],
          "noDataState": "OK",
          "execErrState": "Error",
          "for": "10s",
          "annotations": {
            "summary": "Five or more order confirmation messages are waiting."
          },
          "labels": {
            "severity": "warning"
          }
        },
        {
          "uid": "req6-errors",
          "title": "HttpErrorsHigh",
          "condition": "B",
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 120,
                "to": 0
              },
              "datasourceUid": "req6-prom",
              "model": {
                "refId": "A",
                "expr": "(100 * sum(increase(order_http_requests_total{status=~\"5..\"}[1m])) / clamp_min(sum(increase(order_http_requests_total[1m])), 1)) and (sum(increase(order_http_requests_total{status=~\"5..\"}[1m])) >= 3)",
                "instant": true,
                "range": false,
                "intervalMs": 1000,
                "maxDataPoints": 600,
                "datasource": {
                  "type": "prometheus",
                  "uid": "req6-prom"
                }
              }
            },
            {
              "refId": "B",
              "relativeTimeRange": {
                "from": 0,
                "to": 0
              },
              "datasourceUid": "__expr__",
              "model": {
                "type": "threshold",
                "refId": "B",
                "expression": "A",
                "datasource": {
                  "type": "__expr__",
                  "uid": "__expr__"
                },
                "conditions": [
                  {
                    "type": "query",
                    "query": {
                      "params": [
                        "B"
                      ]
                    },
                    "reducer": {
                      "type": "last",
                      "params": []
                    },
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        5
                      ]
                    },
                    "operator": {
                      "type": "and"
                    }
                  }
                ]
              }
            }
          ],
          "noDataState": "OK",
          "execErrState": "Error",
          "for": "10s",
          "annotations": {
            "summary": "At least three 5xx responses and over 5% errors in the last minute."
          },
          "labels": {
            "severity": "warning"
          }
        }
      ]
    }
  ]
}
