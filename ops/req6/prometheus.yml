global:
  scrape_interval: 5s
  scrape_timeout: 4s
scrape_configs:
  - job_name: gateway
    static_configs:
      - targets: ['http-metrics:9108']
  - job_name: rabbitmq
    metrics_path: /metrics/per-object
    static_configs:
      - targets: ['rabbitmq:15692']
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'rabbitmq_queue_messages(_ready|_unacked)?'
        action: keep
