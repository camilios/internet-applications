map $http_x_forwarded_for $benchmark_client {
    default $remote_addr;
    "~^198\.18\.[0-9]{1,3}\.[0-9]{1,3}$" $http_x_forwarded_for;
}
server {
    listen 80;
    location / {
        proxy_pass http://backend-performance:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $benchmark_client;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
    }
}
