# Add to docker-compose.req5.yml for the professor's SMTP/inbox demonstration.
services:
  mailpit:
    image: axllent/mailpit:v1.27.4
    restart: unless-stopped
    ports: ["127.0.0.1:8025:8025"]
    volumes: [interview_mail:/data]
    environment:
      MP_DATABASE: /data/mailpit.db
    healthcheck:
      test: [CMD, /mailpit, readyz]
      interval: 5s
      timeout: 3s
      retries: 20
  email-worker:
    environment:
      MAIL_MAILER: smtp
      MAIL_SCHEME: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      ORDER_EMAIL_ALLOW_MOCK: "false"
    depends_on:
      mailpit: {condition: service_healthy}
volumes:
  interview_mail: {}
